ing, empty and error states all work and are recoverable."},component:{composition:"Build only the requested component and its immediate context, not an invented whole site.",visualAnchor:"The content and action are the anchor; imagery is optional.",motion:"Animate only meaningful state transitions with keyboard and touch feedback.",interactions:"Click, keyboard, disabled, loading and error behavior are testable."},redesign:{composition:"Preserve the existing product's information architecture and improve only the reported problems; do not invent a new brand.",visualAnchor:"Reuse actual product assets; do not claim to have seen the original site unless it was provided and accessible.",motion:"Keep existing interaction patterns unless changes make the task clearer.",interactions:"Do not break the main journey while improving navigation, focus and feedback."}};function sE(t){const i=[],o=Dn(t),l=tc(t,/作品集|摄影|SaaS|餐厅|咖啡|烘焙|书店|服装|音乐|教育|医疗|房产|旅行|金融|产品发布|社群|portfolio|photography|restaurant|cafe|bakery|bookstore|fashion|music|education|travel|fintech/i),c=tc(t,/极简|暗黑|深色|温暖|复古|优雅|大胆|优美|高级|科技|编辑感|粗野主义|minimal(?:ist)?|dark|warm|retro|elegant|bold|editorial|brutalist|beautiful|cinematic/i),u=tc(t,/React|Next\.?js|Vue|Vite|Tailwind|Framer Motion|HTML|CSS|原生 JS|TypeScript|Svelte/i),f=tc(t,/预约|搜索|购物车|结账|筛选|登录|地图|联系表单|订阅|动画|滚动|交互|booking|search|cart|checkout|filter|login|map|contact form|subscribe|animation|scroll/i);l&&i.push(`${o?"Subject":"主题/领域"}：${l}`),c&&i.push(`${o?"Style":"风格线索"}：${c}`),u&&i.push(`${o?"Stack":"技术约束"}：${u}`),f&&i.push(`${o?"Behavior":"功能/动效"}：${f}`);const m=t.match(/https?:\/\/[^\s，。)]+/gi)?.slice(0,2)||[];for(const p of m)i.push(`${o?"User reference":"用户提供的参考"}：${p}`);return i}function ci(t,i){return typeof t=="string"&&t.trim()?t.trim().slice(0,360):i}function R1(t,i,o){if(!Gc(t,i))return null;const l=O1(t),c=Dn(t),u=c?oE[l]:iE[l],f=o&&typeof o=="object"?o:{},m=Object.values(f).some(y=>typeof y=="string"&&y.trim().length>5),p=sE(t),g=[];return/品牌|店铺|公司|项目|产品|作品集|摄影|餐厅|咖啡|烘焙|书店|服装|SaaS|portfolio|store|studio|product|for\s+my/i.test(t)||g.push(c?"No brand or subject supplied: choose one small demo concept, label it as provisional and do not imply it is a real company.":"未说明具体主题或品牌：先选一个小而完整的演示场景，明确标注为示例，不虚构真实公司与用户。"),/图片|照片|视频|素材|image|photo|video|asset/i.test(t)||g.push(c?"No media provided: use relevant, replaceable demo assets and be explicit about missing originals.":"没有给素材：优先使用可获得且相关的视觉素材；如不可用，提供明确标注的可替换演示方案。"),/React|Next\.?js|Vue|Vite|Tailwind|HTML|CSS|TypeScript|Svelte/i.test(t)||g.push(c?"No stack specified: reuse the current project stack, or pick a small runnable setup for a new project.":"未指定技术栈：若已有项目则沿用它；若是空项目才选择最小可运行的方案并说明。"),{kind:l,label:c?aE[l]:nE[l],source:m?"ai":"guided",explicitSignals:p,openDecisions:g,visualDirection:ci(f.visualDirection,c?"Choose a specific art direction for the subject and explain why it fits; do not default to purple gradients or generic 'premium' styling.":"选择一个与用户主题和用途匹配的视觉方向，并说清它为何合适；不要默认套用同一种紫色渐变或高级感。"),composition:ci(f.composition,u.composition),typography:ci(f.typography,c?"Assign display and reading type separate jobs, with an intentional scale and reading width.":"分别决定展示字体、正文字体、字号比例和阅读行宽，让字形与内容层级服务于主题。"),colorRoles:ci(f.colorRoles,c?"Assign canvas, surface, text, secondary text and action colors clear roles; check contrast.":"明确画布、表面、正文、次级文字和行动色的职责；只在必要的位置使用强调色并检查对比度。"),visualAnchor:ci(f.visualAnchor,u.visualAnchor),motion:ci(f.motion,u.motion),interactions:ci(f.interactions,u.interactions),implementation:ci(f.implementation,c?"Reuse the existing project stack; if starting from scratch choose a small runnable setup and deliver source, a run command and browser checks.":"沿用现有项目栈；若从零开始，选一套最小且完整的可运行方案，交付源码、运行命令与浏览器验证方式。")}}const $1=`网页构建请求额外遵守：
- 用户说「做网站」就要求执行者交付真正可运行的网站，不是只写设计说明、线框图或页面方案；只有用户明确要求设计稿/规范时才改交付物。
- 从 frontendBrief 中选择一条与用户主题相符的艺术方向，具体写出画面构图、字体角色、颜色职责、内容节奏、素材/视觉锚点和主要交互，不能只写「做得好看、现代、高级」。这些是可调整的设计建议，不是用户事实。
- 区分网站类型：营销页面的首屏读成一个完整画面，核心品牌、主张、简短说明、单一主要行动和真实主视觉优先；产品控制台、编辑页面和单组件不强加营销首屏或满屏大图。每个后续区块有独立目的；避免通用三卡片、虚假统计和装饰徽章。
- 视觉参考只能借鉴信息层级、类型尺度、颜色职责和动效节奏，不得复制参考网站的专有商标、文案、布局或付费模板提示词。若用户给出具体链接，要求执行者先查看链接再借鉴；无法打开时不要假称已看过。
- 描述交互时给出真实行为而非仅有外观。若需要动效，只选 2-3 个有用途的动效并交代触发、时长、缓动和出现顺序；保证触屏、键盘及 prefers-reduced-motion。尊重用户要求静态页面的情况。
- 素材必须服务于产品、作品、人物或场景。缺图时给出可替换的合理方案，不用抽象渐变冒充产品/地点，不捏造品牌和客户信息。
- 明确手机和桌面断点、文字对比度、焦点态与素材加载，必要时包含空/加载/错误状态。交付完整能运行的页面或组件，并要求构建与浏览器验证。
- 尊重用户指定的技术栈；若已有仓库沿用其组件和视觉语言，不强行改成单文件 HTML 或另一框架。`,H1=`For website-building requests:
- When the person asks to make a website, the executing model must implement and deliver a working site, not stop at a design specification, mockup, wireframe or plan. Produce a design-only artifact only if expressly requested.
- Turn the frontendBrief into one concrete art direction for this user's subject: composition, type roles, color roles, content rhythm, relevant media and working interactions. These are proposed decisions, never product facts.
- Match the kind of site. A promotional page has one branded first-view composition, one main action and a relevant dominant visual; a dashboard or component does not need a marketing hero. Give each later section one job. Avoid generic three-card grids and made-up statistics.
- Borrow only reusable hierarchy, typography, color roles and motion rhythm from design references. Do not copy their proprietary identity, page design, wording or paid prompts. For a user-provided URL, tell the builder to inspect it if available; otherwise do not claim it was seen.
- Only if motion serves the task, use two or three purposeful transitions and specify trigger, duration, easing, order and reduced-motion behavior. Honor a request for a static page.
- Let relevant product, work or context media carry the visual. If absent, label demo media as replaceable. An abstract gradient is not a product or a place.
- Deliver working interactions, responsive mobile/desktop layouts, keyboard focus and accessible contrast. Follow the existing project's stack; do not force a single-file HTML implementation.`,jc=[{id:"web-landing",category:"coding",webKind:"site",language:"zh",title:"一句话做一个网站",input:"帮我做一个优美的网页",judgement:"网站构建请求；用途、主题和技术栈都没给，不能虚构真实品牌或固定成单文件 HTML。应选一个标明为演示的具体主题，用统一的构图、类型尺度、颜色职责和真实视觉锚点把「优美」落成可执行的方向。",optimized:`## 目标与交付
请为一个明确标注为演示的创意项目构建一页视觉有辨识度、可运行的网站；如果已有项目，沿用它的技术栈，不从零改框架。

## 原始需求与已知信息
<user_request>帮我做一个优美的网页</user_request>
已知：用户只要求网页优美。默认假设：暂以创意项目展示为演示主题，名称和内容只是可替换样例，不当作真实品牌事实。

## 执行步骤
先确定页面希望访客完成的一个主要动作，再围绕它设计首屏与后续内容。选择一种与主题一致的视觉方向，说明展示字体与正文字体各自的职责、画布与行动色如何分配、内容宽度和留白节奏。用与项目相关的作品或场景作为主视觉；缺少真实素材时用注明可替换的示意素材。只为内容进入与主要操作设计两处克制的动效，写明触发、时长与缓动。

## 输出契约
交付完整源码、运行命令及主要可替换内容；桌面与手机均可用，主要导航和行动按钮须有真实行为。不要使用统一三卡片、纯渐变充当主视觉或虚构的客户评价。

## 质量检查
交付前验证首屏层级、交互、键盘焦点、窄屏排版与 reduced-motion；不得编造品牌事实。`},{id:"web-open-english",category:"coding",webKind:"site",language:"en",title:"A beautiful website from one line",input:"I want to make a beautiful website",judgement:"A website build, not a request for web-design advice. No product, audience or existing stack is specified; pick one clearly labelled demo direction, never imply it is the user's real business.",optimized:`## Goal and deliverable
Build a distinctive, working website rather than a mockup. Choose one provisional demo subject because none was provided, label it as an assumption, and keep its copy and images replaceable.

## Request and known information
<user_request>I want to make a beautiful website</user_request>
The only stated preference is visual quality. There is no supplied brand, audience, content or technical stack.

## Execution plan
